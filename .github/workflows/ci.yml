name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check src/mango_explorer/atlas src/mango_explorer/boundaries.py tests/atlas scripts
      # golden files must be what the current Python code produces
      - run: python scripts/make_goldens.py && git diff --exit-code -- golden/core.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd web && npm ci && npm run check && npm test && npm run build
