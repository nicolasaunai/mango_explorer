name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The MANGO atlas is built offline (python -m mango_explorer.atlas build --mango-api, then
  # `pack`) and attached to this release; bump the tag to publish a new atlas.
  ATLAS_TAG: atlas-2026.0-grid-v2-voxels

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the published MANGO atlas
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release download "$ATLAS_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tar' --dir "$RUNNER_TEMP/atlas"
          mkdir -p web/public/atlas
          tar -xf "$RUNNER_TEMP"/atlas/*.tar -C web/public/atlas
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: cd web && npm ci && npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
      - uses: actions/deploy-pages@v4
